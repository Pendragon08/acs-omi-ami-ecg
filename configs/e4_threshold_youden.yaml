# Final E4 three-label operating point selected from validation OOF only.
# The checkpoint, split, preprocessing, and model are unchanged.
model_variant: e4
labels: [STEMI, NSTEMI, UA]
threshold_selection:
  method: youden_j
  objective: sensitivity + specificity - 1
  source: five_fold_patient_level_oof
  test_labels_used: false
thresholds:
  STEMI: 0.030539993196725845
  NSTEMI: 0.03505454584956169
  UA: 0.3236314058303833
primary_metrics:
  - AUPRC
  - sensitivity
  - specificity
secondary_metrics:
  - AUROC
  - PPV
  - NPV
  - F1
  - MCC
  - accuracy
