# Registered four-label architecture comparison.
# Only the model changes between runs; the data/split/training/evaluation
# protocol is shared with the historical E4 experiment.
task: four_independent_multilabel_binary_outputs
labels: [STEMI, NSTEMI, UA, OMI]
models: [InceptionTime, ResNet1D_Wang, LSTM, ViT, Transformer1D]
data_loader: experiments.hmoe_kan_e4_4label_multilabel.load_data
split:
  protocol: patient_level_iterative_multilabel_stratified
  n_folds: 5
  fold_seed: 2026
training:
  seed: 2026
  loss: BCEWithLogitsLoss
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 128
  epochs_max: 100
  early_stopping_patience: 15
  scheduler: none
  gradient_clip_norm: 1.0
  train_only_augmentation: true
evaluation:
  threshold_grid: [0.01, 0.99, 0.01]
  primary_threshold: youden_j
  secondary_thresholds: [fixed_0.5, max_f1, sens90, sens95]
  metrics: [AUROC, AUPRC, sensitivity, specificity, PPV, NPV, F1, MCC, accuracy, TP, TN, FP, FN]
